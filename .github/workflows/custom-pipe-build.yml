name: Custom Pipe Branch Build

on:
  push:
    branches:
      - custom-pipe
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:

  jdk8:
    name: Build with Ant (Java 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Ensure Ant present
        run: |
          if ! command -v ant >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ant
          fi
          ant -version

      - name: Build with Ant
        run: ant -noinput

      - name: Check PlantUML version (expect exit code 16)
        run: |
          set +e
          java -jar plantuml.jar -version
          CODE=$?
          echo "Exit code: $CODE"
          if [ $CODE -ne 16 ]; then
            echo "::error::Unexpected exit code (expected 16, got $CODE)"
            exit 1
          fi

      - name: Upload plantuml.jar
        uses: actions/upload-artifact@v6
        with:
          name: plantuml-custom-pipe-jdk8-jar
          path: plantuml.jar
          if-no-files-found: error
          retention-days: 90

      - name: Run sample diagram test (ASCII)
        run: |
          echo "Alice -> Bob : it works!" | java -jar plantuml.jar -pipe -ttxt

  build_artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Generate artifacts
        run: |
          echo "print gradle.properties"
          cat gradle.properties
          gradle clean build \
            pdfJar \
            generateMetadataFileForMavenPublication generatePomFileForMavenPublication \
            -x test
          find . -name "*.jar"

      - name: Get release version
        id: version
        run: |
          echo "release_version=$(gradle properties -q | grep "version:" | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Upload all artifacts
        uses: actions/upload-artifact@v6
        with:
          name: plantuml-custom-pipe-all-jars
          path: |
            build/libs/*
            build/publications/maven/*
            plantuml-asl/build/libs/*
            plantuml-bsd/build/libs/*
            plantuml-epl/build/libs/*
            plantuml-lgpl/build/libs/*
            plantuml-mit/build/libs/*
            plantuml-gplv2/build/libs/*
          if-no-files-found: error
          retention-days: 90
